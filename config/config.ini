[Server]
# 控制台详细程度：0 最简、2 最详（2 与 3 的行为逐条相同，填 3 会被归一成 2）；
# 2 会在启动横幅后附上各级别说明
display_level = 1
# 代理监听端口，HTTP 与 SOCKS5 共用（1-65535）
port = 1080
# Web 面板端口（1-65535）
web_port = 5001
# 运行模式。这个键在不同来源下问的是**两件不同的事**，取值也不同：
#   local 来源（本地代理文件）—— 问「挑谁」：
#     cycle       按清单顺序使用（忽略负载，前一条满了才用下一条）
#     loadbalance 谁压力小先用谁
#   api / pool 来源 —— 问「什么时候换」：
#     continuous  持续更换：与有没有流量无关，后台按寿命主动换掉到期的并补满
#     request     触发更换：只在收到新任务时取货、换出口；没有任务时到期的出口直接移除，
#                 池子会空掉，下一个请求到达时重新取货填满
# 换来源时若当前值不属于新那一组，会自动归一到该组的默认值（列表中第一个）
mode = request
# 每个出口的寿命上限（秒）：入池满这么久就被换掉。每个出口各自计时（就是「自己入池 +
# interval」，一批同时入池的因此同时到期），到期的全部更换，不是每隔这么久只换一个。
# 所有来源、四种运行模式都生效（本地来源也按寿命轮换，换上来的是文件里的下一条；
# 文件里没有备用条目时原地重开一次寿命）。**换的时机**由运行模式决定：持续更换在后台
# 主动换，触发更换只在收到新任务时换、空闲时到期的直接移除。
# 它与下面的 request_interval 是**两条各自独立的规则，同时生效**，两个都填时谁先到谁换，
# 不是二选一。0 表示不按时间计
interval = 60
# 代理来源：local（读 proxy_file）/ api（取 api_proxy_url）/ pool（用代理池）
proxy_source_mode = pool
# 代理来源为 api 时，取代理地址的接口
api_proxy_url = 
# 拼接到取回的代理地址上的认证账号；与 proxy_password 都非空才生效，
# 不用于接口本身（api_proxy_url）的认证
proxy_username = 
# 拼接到取回的代理地址上的密码，与 proxy_username 成对使用
proxy_password = 
# 代理来源为 local 时的代理列表文件名；只取文件名，固定从 config/ 目录读取
proxy_file = ip.txt
# 代理存活检测的目标地址；代理池的 validator.target_url 也由它派生
test_url = https://www.baidu.com
# 界面与提示语言：cn / en
language = cn
# IP 白名单文件名；只取文件名，固定从 config/ 目录读取
whitelist_file = whitelist.txt
# IP 黑名单文件名；只取文件名，固定从 config/ 目录读取
blacklist_file = blacklist.txt
# 同时命中黑白名单时的判定优先级：whitelist（放行）/ blacklist（拦截）
ip_auth_priority = whitelist
# Web 面板访问令牌，经 ?token= 校验；留空表示面板不校验
token = honmashironeko
# 每个出口的寿命上限（分配出去多少次后更换）：也是每个出口各数各的。数的是「分配次数」，
# 一次请求用到它算一次，重试换到另一个出口会在那边再算一次。它与上面的 interval 是
# **两条各自独立的规则，同时生效**，两个都填时谁先到谁换。0 表示不按请求数计
request_interval = 0
# 启动时是否先检测一遍代理可用性
check_proxies_on_startup = true
# 把候选填进出口池之前是否先校验一次（发一次真实请求）；不合格的丢掉换下一条。
# 不是按请求校验：出口在服役期间失效靠失败淘汰兜底
check_proxies_on_use = true
# 远程代理池的管理接口地址；留空表示使用进程内的代理池
pool_remote_url = 
# 版本检查的源地址；留空表示并发请求内置的 GitHub 地址（官方 releases.atom、gh-proxy 镜像、
# GitHub 官方 API），谁先返回可用的版本号就用谁。填写后只请求填写的这一个地址，可填 GitHub API、
# releases.atom 或任何能解析出版本号的页面，必须是 http/https 开头的完整地址。
# 注意：内置源里的第三方镜像会看到你的请求 IP，且可能返回缓存的旧版本；官方 API 未认证时
# 每 IP 每小时限 60 次。改后下次检查生效
version_check_url = 
# 批量检测代理的并发数上限（1-1000）
check_concurrency = 100
# 日志级别：DEBUG / INFO / WARNING / ERROR / CRITICAL
log_level = INFO
# 单个日志文件的大小上限（字节），超出后轮转
log_max_bytes = 10485760
# 轮转后保留的历史文件份数；至少 1（0 会让日志永不轮转）
log_backup_count = 3
# 是否把每次代理访问写进访问日志（logs/access.log）
log_access_enabled = true
# 绕过名单文件名，其中的目标地址不做拦截判断；只取文件名，固定从 config/ 目录读取
bypass_whitelist_file = bypass_whitelist.txt
# 重取出口批次后的冷却时间（秒）；冷却内不再重取（补货也受它限流）。对三种来源一视同仁
switch_cooldown = 1
# 代理可用性检测结果的缓存有效期（秒）
proxy_check_ttl = 30
# 两次可用性检测之间的冷却时间（秒）
check_cooldown = 5
# 故障告警的折叠窗口（秒）：同一类告警在窗口内只写一条日志，并记下被折叠了多少条。
# 高并发下失败是成批来的，不折叠日志会被同一句话刷满。折叠**只发生在日志层**，
# 出口的记账与调度不受影响（那套看的是近期失败占比，不靠计时器）。
proxy_failure_cooldown = 3
# 明文 HTTP 转发累计多少字节就施加一次背压（等客户端把数据读走），最小 1024。
# 它不控制切块大小 —— 响应体按上游交付的原生块（通常 64 KiB）转发，不做重切；
# 隧道中继固定 64 KiB，也不受这一项影响
buffer_size = 8192
# 隧道建立后「客户端发过数据、上游一个字节都没回」持续多久判为上游装死（秒）；
# 0 表示不判。这是发现「收下 CONNECT 后不回数据」的唯一手段，但上游只是排队很慢
# 时也会命中 —— 上游在高并发下响应普遍超过这个值，就把它调大
tunnel_idle_timeout = 10
# 同时处理的请求数上限，超出后在信号量上排队
max_concurrent_requests = 3000
# 连接池中缓存的客户端数量上限，达到上限时淘汰最久未使用的。**面板不再展示这一项**：
# 实际取值是 max(本值, 名册数 × 2, 出口数 × 4) —— 按当前名册与扩容上限推算，
# 低于推算值时本值被忽略（低于它每个出口的客户端会互相淘汰，连接复用就没了）。
# 留在这里只为了兼容老配置里调大过的值
max_pool_size = 500
# 单个上游代理的活跃连接上限；0 表示不限制。数的是「正在用」的连接：请求转发期间算，
# 隧道建立后只有真的在传数据才算，空闲隧道不占额度（所以它是一道准入控制，不是同时在
# 挂的上游连接数的硬上限）。总上游并发 ≈ 出口数 × 该值（受上面一项封顶）
max_concurrent_per_proxy = 0
# 出口池的目标容量：保持这么多个上游出口在用。**换的时机由运行模式决定**：持续更换
# （continuous）与流量无关、后台一直补满；触发更换（request，本仓库出厂值）与本地来源
# 由请求驱动 —— 空闲约 10 秒后不再补货，到期的出口被移除而不是换新，池子可能空掉
# （池子空着或缺口挂着，下一个请求就要在请求路径上干等一次取货 + 校验）。取回后并发
# 校验候补、逐槽填到满，某个出口失效就单独补上它，不整批替换。pool / local 按它取用
# （local 把它当上限，文件不够就用多少算多少）；api 取回几条由接口自己决定，这里只决定
# 要用几条。调小它，名册当场收回多余的（不等寿命）；每个出口一个客户端，调很大要留意
# 连接与内存开销
exit_count = 10
# 高峰期自动扩容出口池，两条触发路径：
#   ① 立刻 —— 监听端口上此刻挂着的连接数超过「在用出口数 × 单出口额度」时，当场把出口数
#      翻倍（上限 2 倍）并一次补齐，不用等水位。5 个出口 × 100 的额度撞上 1000 并发，
#      靠的就是这一条。
#   ② 兜底 —— 后台按「顶到单出口额度的出口占比」（八成持续 1 秒）逐格加出口。
# 收回看「整池利用率」（一半以下持续 30 秒），阈值与时长固定在代码里、不开放配置。
# 只在取回过货、拿到答复、却没有可用新候选时才放宽单出口额度（最多到 2 倍）—— 取货失败
# 或超时不算；名册上限 = max(exit_count, min(exit_count × 2, max_concurrent_requests))，
# 到上限就停。停止扩容后，多出来的出口**用满自己的寿命**才逐个撤下，不会刚取回来就丢掉。
# max_concurrent_per_proxy 为 0（不限）时不扩，但已经张开的膨胀状态照常收回 —— 那时
# 出口层面不会排队
auto_expand_enabled = true
# 一个可用出口都没有时（刚启动、换来源、出口全被停用、取代理失败），请求排队等
# 多久（秒）；等到有出口就照常服务，超时才回 503。填 0 表示不等、当场回 503
exit_wait_timeout = 30
# 每个上游出口的 HTTP 客户端连接上限。**面板不再展示这一项**：实际取值是
# max(本值, 单出口并发上限 × 2)，单出口不限并发时退回全局并发上限 —— 设小了会把
# 请求闷进 httpx 连接池排队。留在这里只为了兼容老配置里调大过的值
client_max_connections = 1000
# 每个上游出口保持的保活连接数。**不要调大**：httpx 的连接池在分配请求时会对
# 空闲连接做一遍全池扫描（httpcore 1.0.9 的实现），空闲连接越多，每个请求花在这
# 上面的 CPU 越多 —— 实测池里空闲连接几十条时它就能吃掉单核的一半以上，吞吐掉到
# 三分之一。压小这一项（连接用完就关、用时再建）实测在有无上游延迟两种场景下都
# 更快；真要让单个出口扛更多并发，调 client_max_connections 而不是这一项
client_max_keepalive = 8
# 空闲回收（秒）：保活连接空闲这么久就失效；装这些连接的客户端按同一个时间回收
# （它不该比连接活得短）。调小会让刚预热好的连接被丢掉、连接复用变差
client_keepalive_expiry = 30
# 客户端的连接池空闲多久后回收（秒）。**面板不再展示这一项**：由上面的
# client_keepalive_expiry 推出，取 max(它, 30)。留在这里只为了兼容老配置
client_idle_timeout = 300
# 是否按「域名 × 上游代理」累计访问统计（面板「运行日志」页的访问统计）
domain_stats_enabled = true
# 访问统计的落库间隔（秒）
domain_stats_flush_interval = 15
# 访问统计的保留天数；0 表示不清理
domain_stats_retention_days = 30
# 是否逐条记录每一次代理请求（面板「运行日志」页的访问明细）
access_records_enabled = true
# 逐条记录的落库间隔（秒）
access_records_flush_interval = 5
# 逐条记录的保留天数；0 表示不按时间清理
access_records_retention_days = 7
# 逐条记录的行数上限，超出后裁掉最旧的；0 表示不限制
access_records_max_rows = 200000
# 逐条记录的内存缓冲条数，超出后丢最旧的并计数；调小需重启生效
access_records_buffer_size = 20000
# 出口地址是网关时，经它探测一次真实出口 IP（仅 API 来源；每个地址多消耗一次代理流量）。
# 代理池来源直接用池里已验证的出口 IP，本地代理不探测
access_records_real_ip_probe = true

[Users]
# 出口代理的认证账号：键为用户名、值为密码；整段为空表示代理不要求认证。
# 请通过面板的用户管理修改 —— 直接编辑本段不会自动同步到运行中的服务。
k = 123
neko = 123456

[api_credentials]
# 可用的取 IP 凭据集合，JSON 数组，每项为 {"name", "url", "username", "password"}；
# 由面板维护，手改本行必须保持为合法 JSON，否则整份凭据都读不出来。
credential_sets = []
# 当前启用的凭据名，须与 credential_sets 中某一项的 name 完全一致；不一致时视为未选用
active_credential = 

[Pool]
# 代理资源池配置。修改后保存即可热生效，无需重启；
# 也可以通过 Web 界面的「池设置」页面修改 —— 两边是同一份配置。
# ==================================================================

# ── 数据库 ──────────────────────────────────────────────────
# 代理池所有数据存放的文件（SQLite 格式）。填相对路径时以 modules/proxypool/ 目录为起点。改这一项保存后不会立即生效，需重启池服务 —— 库在启动时就已经打开了
database.path = data/proxies.db
# 同时查询数据库的连接数上限，写入固定只占 1 个连接。调大能让并发查询更顺畅，也会多占用一些文件句柄；池子不大时保持默认即可。改这一项保存后不会立即生效，需重启池服务
database.pool_max_readers = 4
# 是否按下面的间隔自动备份数据库；保存后立即生效（关掉即停，重新打开即起）
database.backup_enabled = true
# 自动备份的间隔（小时）
database.backup_interval_hours = 24
# 备份文件保留多少天，超期自动删除
database.backup_retention_days = 7

# ── 代理验证 ────────────────────────────────────────────────
# 是否检查代理的匿名度。匿名度靠「目标站点实际收到了哪些请求头」判定，只在经代理发一次明文请求时才测得出来；关掉后不再发这类请求、也不再判匿名度，已经测出来的等级原样保留
validator.check_anonymity = true
# 本机公网出口 IP，判定「透明代理」时的对比基准。双栈主机两族各填一个、用逗号隔开（IPv4 与 IPv6 各至多一个），两族都会参与比对；只填一个也能用。留空时 ProxyCat 会**不经过代理**直接访问 IP 查询站点获取（每小时最多一次）；在这里填上你自己的出口 IP 可以完全免掉这次对外请求。留空或拿不到时无法判定匿名度，那一项会保持原样
validator.host_public_ip = 
# 验证一个代理最多等多少秒，超过就判为不可用。所有探测请求都按这个上限
validator.timeout_seconds = 5
# 连接代理最多等多少秒。失效的代理大多卡在连不上这一步，调小它可以明显加快整批验证；填 0 表示不单独限制，只受上面的总超时约束
validator.connect_timeout_seconds = 2.0
# 同时验证多少个代理。每次验证连的是不同主机，可以放心调高；同时它也决定本机连接池上限与可打开的 socket 数（一次验证会并发发出十几个请求），受限环境应调低；如果测试站点开始限流（表现为大量代理突然超时），也调低一些
validator.max_concurrent = 400
# 用来探测出口 IP 和匿名度的接口，多个用英文逗号分隔，必须是 https。这类接口要能返回 origin 与 headers，一次请求就能同时得出出口 IP、匿名度和 HTTPS 支持情况。连不上的会被自动跳过；可用的按直连延迟排序后逐个补发竞速，不按条数截断，多写的留作替补
validator.identity_echo_apis = https://httpbin.org/anything, https://httpbingo.org/anything, https://eu.httpbin.org/anything
# 补充的明文回显接口，多个用英文逗号分隔，必须是 http。匿名度靠「目标实际收到了哪些请求头」判定，明文路径是它的标准观测面，默认用的是上面几个接口的明文地址。如果代理够不到那些站点、导致匿名度总被判成兜底档，可以把代理能访问的回显站点填在这里
validator.plain_identity_echo_apis = http://postman-echo.com/get
# 只返回 IP 的接口，多个用英文逗号分隔，必须是 https。上面的接口都拿不到结果时用它们兜底，同样按直连延迟逐个补发竞速，不按条数截断
validator.ip_check_apis = https://icanhazip.com, https://checkip.amazonaws.com, https://api.ip.sb/ip, https://realip.cc/simple, https://httpbin.org/ip, https://api.ipify.org, https://ipinfo.io/json, https://ipwho.is/, https://www.cloudflare.com/cdn-cgi/trace

# ── 抓取插件 ────────────────────────────────────────────────
# 多久检查一次有没有插件该抓取了（秒）。它只决定检查的频率，不改变各插件自己的抓取周期
plugins.scan_interval_seconds = 60
# 新插件默认多久抓取一次（分钟）。每个插件都可以单独调整自己的周期
plugins.default_interval_minutes = 60
# 单个插件一次抓取最多跑多少秒，超时就中断
plugins.execution_timeout_seconds = 300
# 插件请求一次网页最多等多少秒；目标站点打不开时按这个时间等待
plugins.request_timeout_seconds = 30
# 最多同时运行几个插件
plugins.max_parallel_plugins = 3
# 插件抓取失败后额外重试几次。填 2 表示最多一共尝试 3 次
plugins.max_retries_on_failure = 2
# 插件失败后重试前等待的秒数。每多试一次等待翻倍（第 1 次等 1 倍、第 2 次 2 倍、第 3 次 4 倍），避免短时间内反复打同一个站点
plugins.retry_base_delay_seconds = 10.0

# ── 自动重新验证 ────────────────────────────────────────────
# 是否定时重新检查已入库的代理还能不能用
auto_revalidation.enabled = true
# 默认多久重新检查一遍（分钟）。每个插件可以在「插件管理」里单独设置自己的周期
auto_revalidation.interval_minutes = 360
# 只检查当前可用的代理，跳过已经判定失效的
auto_revalidation.only_valid_proxies = true
# 启动后马上先检查一遍，而不是等满一个周期
auto_revalidation.run_on_start = true
# 多久做一次完整检测（分钟）。日常检查只看代理还通不通；出口 IP、匿名度、协议支持这些信息很少变，隔较长时间重新测一遍即可
auto_revalidation.full_recheck_interval_minutes = 1440

# ── 自动清理 ────────────────────────────────────────────────
# 是否自动删除质量太差的代理。删除不可恢复，拿不准时先关掉它只做检查
auto_cleanup.enabled = true
# 健康分低于这个值的代理会被删除，同时还要满足下一条的次数要求
auto_cleanup.min_health_score = 10.0
# 至少检查过多少次才允许按评分淘汰，避免刚入库的代理因为样本太少被误删
auto_cleanup.min_checks_before_cleanup = 3
# 连续失败这么多次就删除
auto_cleanup.max_failures = 3
# 判定失效后最多再保留几天，超过就删除
auto_cleanup.max_age_days_if_invalid = 3

# ── 使用期反馈 ──────────────────────────────────────────────
# 代理在实际转发中不通时，是否把它记为一次失败并在连续失败达阈值后标记失效。检测分不清「代理坏了」和「我们自己网络抖动」，阈值就是用来吃掉后者的；关掉后池只信自己的验证结果
use_feedback.enabled = true
# 连续失败这么多次就标记失效，期间任何一次成功都会清零
use_feedback.invalid_threshold = 3

# ── 写入队列 ────────────────────────────────────────────────
# 攒够多少条记录才一次性写进数据库
write_queue.batch_size = 100
# 一批记录最多尝试写几次（含第一次）。填 0 或 1 都表示失败就放弃
write_queue.max_retries = 3
# 等待写入的任务最多排多少个。排满后新任务会被拒绝，以免占用过多内存。这一项保存后不会立即生效，需重启服务（队列容量在创建时固定，中途改会丢掉已排队的数据）
write_queue.max_queue_size = 10000

# ── 日志 ────────────────────────────────────────────────────
# 代理池的日志文件。填相对路径时以 modules/proxypool/ 目录为起点
logging.file_path = logs/proxy_pool.log
# 单个日志文件的大小上限（字节）。写满后自动换一个新文件，旧文件继续保留
logging.max_bytes = 10485760
# 最多保留几个历史日志文件
logging.backup_count = 5
